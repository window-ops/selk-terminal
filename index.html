<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Selk, a database investigation game on a failing Titan megastructure.">
    <title>Selk terminal</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/crt.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/cursors.css">
  </head>
  <body>
    <div class="room">
      <div class="monitor">
        <div id="screen" class="screen">
          <div id="panes" class="panes"></div>
          <div id="desk" class="desk" hidden></div>
          <nav class="fbar" aria-label="Function keys">
            <button type="button" data-f="1"><span class="fk">1</span>HELP</button>
            <button type="button" data-f="2"><span class="fk">2</span>MAIL</button>
            <button type="button" data-f="3"><span class="fk">3</span>VIEW</button>
            <button type="button" data-f="4"><span class="fk">4</span>USE</button>
            <button type="button" data-f="5"><span class="fk">5</span>REPORT</button>
            <button type="button" data-f="6"><span class="fk">6</span>HINTS</button>
            <button type="button" data-f="7"><span class="fk">7</span>UNLOCK</button>
            <button type="button" data-f="8"><span class="fk">8</span>WATCH</button>
            <button type="button" data-f="9"><span class="fk">9</span>SETUP</button>
            <button type="button" data-f="10"><span class="fk">10</span>EXIT</button>
          </nav>
          <footer class="tmux" aria-label="Session status">
            <span id="tmux-wins" class="tmux-wins"></span>
            <input id="tmux-prompt" class="tmux-prompt" type="text" hidden autocomplete="off" spellcheck="false" aria-label="tmux command prompt">
            <span id="tmux-msg" class="tmux-msg" role="status"></span>
            <span class="tmux-right">
              <button type="button" id="tmux-shell-action" class="st-btn tmux-shell-action" hidden>POP OUT SHELL</button>
              <button type="button" id="st-mail" class="st-btn">MAIL</button>
              <button type="button" id="st-report" class="st-btn">REPORT</button>
              <span id="st-uplink"></span>
              <span id="st-hint" class="st-hint" hidden>HINT</span>
              <button type="button" id="st-sound" class="st-btn" aria-pressed="true">SOUND ON</button>
              <button type="button" id="st-mode" class="st-btn" title="Switch to desktop mode">DESKTOP</button>
              <span id="st-user" class="st-user"></span>
              <span id="st-clock"></span>
            </span>
          </footer>
          <div class="glass" aria-hidden="true"></div>
        </div>
        <div class="badge" aria-hidden="true">
          <span class="brand">CESEA</span>
          <span class="ledbox"><span class="led pwr"></span><span class="ledlab">POWER</span></span>
          <span class="ledbox"><span id="led-hdd" class="led hdd"></span><span class="ledlab">HDD</span></span>
        </div>
      </div>
    </div>
    <div id="kind-park" hidden>
      <div id="k-shell" class="shell">
        <div id="log" class="log scroll" role="log" aria-live="polite"></div>
        <div class="inputline">
          <label id="prompt" class="prompt" for="cmd">selk:/&gt;</label>
          <input id="cmd" class="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Command">
        </div>
      </div>
    </div>
    <script src="js/data/notes.js"></script>
    <script src="js/data/entries.js"></script>
    <script src="js/data/story.js"></script>
    <script src="js/data/endings.js"></script>
    <script src="js/state.js"></script>
    <script src="js/context.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/screen.js"></script>
    <script src="js/render.js"></script>
    <script src="js/panes.js"></script>
    <script src="js/views.js"></script>
    <script src="js/explorer.js"></script>
    <script src="js/report.js"></script>
    <script src="js/live.js"></script>
    <script src="js/watch.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/extras.js"></script>
    <script src="js/scroll.js"></script>
    <script src="js/ending.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/main.js"></script>
    <script src="js/a11y.js"></script>
    <script src="js/debug.js"></script>
  </body>
</html>
