<style>
  /* The stage: the game's screen at 1920 by 1080 inside a world that the
     camera moves and scales. The CSS animations are off; sim.js sets
     every moving effect from the shot's time. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #world .room, #world .monitor { width: 1920px; height: 1080px; }
  #world *, #world *::before, #world *::after { animation: none !important; transition: none !important; }
  #black { position: absolute; inset: 0; background: #000; display: none; z-index: 3000; }
  .sim-cursor { position: absolute; z-index: 2000; width: 24px; height: 24px; background-repeat: no-repeat; background-size: 24px 24px; pointer-events: none; }
</style>
</head>
<body>
<div id="world"></div>
<div id="black"></div>
<script>
  /* The address names what the shot needs (common/lib/render.js writes it):
     snaps, the captured screens in common/snapshots; shot, the shot's
     script, relative to this page; build, the trailer's build folder, for
     pictures the build draws (the WATCH live feed). They load in order:
     the snapshots, sim.js, then, once the fonts are loaded, the shot. */
  (function () {
    const q = new URLSearchParams(location.search);
    window.BUILD = q.get("build") || "";
    const files = (q.get("snaps") || "").split(",").filter(Boolean).map((n) => "../snapshots/" + n + ".js")
      .concat(["sim.js"]);
    const loaded = files.map((src) => new Promise((ok) => {
      const s = document.createElement("script");
      s.src = src; s.async = false; s.onload = s.onerror = ok;
      document.body.appendChild(s);
    }));
    /* The shot measures the screen when it loads, so it waits for those
       scripts and for the game's fonts: text set in a fallback font has
       other widths */
    Promise.all(loaded.concat([document.fonts.load('15.5px "Plex Mono"'), document.fonts.load('500 15.5px "Plex Mono"'),
      document.fonts.load('14px "Plex Mono"'), document.fonts.load('160px "VT323"')])).then(() => {
      const s = document.createElement("script");
      s.src = q.get("shot") + ".js";
      document.body.appendChild(s);
    });
  })();
</script>
</body>
